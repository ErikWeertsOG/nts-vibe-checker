<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NTS Vibe Checker</title>
    <link rel="stylesheet" href="src/popup.css" />
  </head>
  <body>
    <header>
      <h1>NTS VIBE</h1>
      <div class="meta" id="meta">…</div>
    </header>

    <div class="controls">
      <select id="festival" aria-label="Kies festival"></select>
      <input id="search" type="search" placeholder="Zoek act…" autocomplete="off" />
      <div class="filters">
        <button data-top="10" class="active">Top 10</button>
        <button data-top="25">Top 25</button>
        <button data-top="50">Top 50</button>
        <button data-top="all">Alles</button>
      </div>
    </div>

    <ul id="list" class="list"></ul>

    <details class="settings">
      <summary>Instellingen</summary>
      <label for="baseUrl">Data-URL (je deploy)</label>
      <input id="baseUrl" type="url" placeholder="https://jouw-deploy.vercel.app" autocomplete="off" />
      <button id="saveBase">Opslaan &amp; herladen</button>
    </details>

    <footer>
      <button id="refresh">Refresh data</button>
      <a id="webapp" href="#" target="_blank" rel="noopener">web-app ↗</a>
    </footer>

    <script src="src/storage.js"></script>
    <script src="src/popup.js"></script>
  </body>
</html>
